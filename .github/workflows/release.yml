name: Release

on:
  push:
    tags:
      - "v*"           # triggers on v1.2.0, v2.0.0, etc.

permissions:
  contents: write      # needed to create the GitHub Release

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install Nuitka + helpers
        run: pip install nuitka zstandard ordered-set

      - name: Build with Nuitka (onefile)
        run: |
          python -m nuitka `
            --onefile `
            --windows-disable-console `
            --enable-plugin=wx `
            --include-package=accessible_output2 `
            --include-package=sound_lib `
            --include-package=libloader `
            --include-package=platform_utils `
            --include-package=platformdirs `
            --output-filename=radio_browser.exe `
            --output-dir=build `
            --remove-output `
            src/radio_browser.py

      - name: Compute SHA-256 checksum
        id: sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/radio_browser.exe -Algorithm SHA256).Hash.ToLower()
          echo "HASH=$hash" >> $env:GITHUB_OUTPUT
          echo "SHA256: $hash" > build/radio_browser.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Radio Browser Player ${{ github.ref_name }}
          body: |
            ## Radio Browser Player ${{ github.ref_name }}

            ### Download
            Download `radio_browser.exe` below and run it — no installation required.

            **SHA-256:** `${{ steps.sha256.outputs.HASH }}`

            ---
            *Built automatically from source with [Nuitka](https://nuitka.net/).*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/radio_browser.exe
            build/radio_browser.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
