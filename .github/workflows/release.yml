name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build — ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os-name: Windows
            binary-name: radio_browser.exe
            nuitka-extra: --windows-disable-console
            pip-cache: ~\AppData\Local\pip\Cache

          - runner: macos-latest
            os-name: macOS
            binary-name: radio_browser_mac
            nuitka-extra: ""
            pip-cache: ~/Library/Caches/pip

          - runner: ubuntu-22.04
            os-name: Linux
            binary-name: radio_browser_linux
            nuitka-extra: ""
            pip-cache: ~/.cache/pip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ matrix.pip-cache }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # ── Linux: GTK / WebKit system libs needed by wxPython ────────────
      - name: Install GTK dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            freeglut3-dev \
            libglu1-mesa-dev \
            libnotify-dev \
            libsdl2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            speech-dispatcher \
            libspeechd-dev

      # ── Linux: wxPython has no universal PyPI wheel; use extras.wxpython.org
      - name: Install wxPython (Linux — pre-built wheel)
        if: runner.os == 'Linux'
        run: |
          pip install \
            -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 \
            wxPython==4.2.2

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install Nuitka + helpers
        run: pip install nuitka zstandard ordered-set

      # ── Windows build ─────────────────────────────────────────────────
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --windows-disable-console `
            --enable-plugin=wx `
            --include-package=accessible_output2 `
            --include-package=sound_lib `
            --include-package=libloader `
            --include-package=platform_utils `
            --include-package=platformdirs `
            --output-filename=${{ matrix.binary-name }} `
            --output-dir=build `
            --remove-output `
            src/radio_browser.py

      # ── macOS build ───────────────────────────────────────────────────
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m nuitka \
            --onefile \
            --macos-target-arch=universal \
            --enable-plugin=wx \
            --include-package=accessible_output2 \
            --include-package=sound_lib \
            --include-package=libloader \
            --include-package=platform_utils \
            --include-package=platformdirs \
            --output-filename=${{ matrix.binary-name }} \
            --output-dir=build \
            --remove-output \
            src/radio_browser.py

      # ── Linux build ───────────────────────────────────────────────────
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka \
            --onefile \
            --enable-plugin=wx \
            --include-package=accessible_output2 \
            --include-package=sound_lib \
            --include-package=libloader \
            --include-package=platform_utils \
            --include-package=platformdirs \
            --output-filename=${{ matrix.binary-name }} \
            --output-dir=build \
            --remove-output \
            src/radio_browser.py

      # ── Checksum ──────────────────────────────────────────────────────
      - name: Compute SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = (Get-FileHash "build/${{ matrix.binary-name }}" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.binary-name }}" | Out-File -Encoding ascii "build/${{ matrix.binary-name }}.sha256"

      - name: Compute SHA-256 (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd build
          shasum -a 256 "${{ matrix.binary-name }}" > "${{ matrix.binary-name }}.sha256"

      # Mark Linux binary executable so it survives the upload
      - name: Mark Linux binary executable
        if: runner.os == 'Linux'
        run: chmod +x build/${{ matrix.binary-name }}

      # ── Upload artifacts (used by the release job) ────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary-name }}
          path: |
            build/${{ matrix.binary-name }}
            build/${{ matrix.binary-name }}.sha256
          retention-days: 1

  # ── Create the GitHub Release and attach all platform binaries ──────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Radio Browser Player ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Radio Browser Player ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows  | `radio_browser.exe` |
            | macOS    | `radio_browser_mac` |
            | Linux    | `radio_browser_linux` |

            Each download is a single self-contained binary — no installation required.
            Corresponding `.sha256` files are provided for integrity verification.

            ---
            *Built automatically from source with [Nuitka](https://nuitka.net/).
            Source code is compiled to native C — no embedded .pyc files.*
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
